name: Android APK (older offline-first phone app, manual)

# Builds installable Android APKs (signed with the debug key, so they install directly on a phone for testing;
# not a Play Store build). One file per CPU type, so each is small:
#   arm64-v8a    nearly every phone since 2017
#   armeabi-v7a  older and some budget phones that run 32-bit Android ("App not installed" on the other file)
# Run it from the Actions tab ("Run workflow"), or it runs on every push to a ccr-* branch / main. Download from the
# run's Artifacts, or from the "apk-expo-old" pre-release on the Releases page.

on:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean
      # Signed with your own release key when these repository secrets exist (what you give to clients); otherwise the debug key, which still
      # installs on a phone for testing. ANDROID_KEYSTORE_BASE64 is the .jks file in base64.
      - name: Release key (only when the secrets exist)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "SIGN=1" >> "$GITHUB_ENV"; fi
      - name: Build release APK
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          SIGNING=""
          if [ "$SIGN" = "1" ]; then SIGNING="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.jks -Pandroid.injected.signing.store.password=$KS_PASS -Pandroid.injected.signing.key.alias=$KEY_ALIAS -Pandroid.injected.signing.key.password=${KEY_PASS:-$KS_PASS}"; fi
          ./gradlew assembleRelease -PreactNativeArchitectures=${{ matrix.abi }} --no-daemon $SIGNING
      - name: Name the APK
        id: name
        run: |
          SHORT=$(git rev-parse --short HEAD)
          cp android/app/build/outputs/apk/release/app-release.apk "onesync-erp-${{ matrix.abi }}-$SHORT.apk"
          echo "file=onesync-erp-${{ matrix.abi }}-$SHORT.apk" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: onesync-erp-apk-${{ matrix.abi }}
          path: ${{ steps.name.outputs.file }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: onesync-erp-apk-*
          merge-multiple: true
      - name: Publish to the apk-expo-old pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete apk-expo-old --cleanup-tag --yes || true
          gh release create apk-expo-old *.apk --prerelease --target "$GITHUB_SHA" \
            --title "OneSyncERP – latest test APK" \
            --notes "Debug-signed test build of $GITHUB_SHA. Most phones: the arm64-v8a file. If it says 'App not installed' (older or 32-bit phones), use the armeabi-v7a file. Enable 'install unknown apps' to install."
