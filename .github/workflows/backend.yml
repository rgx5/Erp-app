name: backend
on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
defaults:
  run:
    working-directory: backend
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install -g npm@11.21.2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Integration tests (real PostgreSQL, actual runtime role; both HTTP adapters)
        run: npm run test:integration
        env:
          TEST_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5434/postgres
      - run: npm run build
      - name: Performance smoke
        run: npm run perf
        env:
          PERF_SECONDS: '3'
          TEST_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5434/postgres
  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target runtime -t onesync-api:ci backend
      - run: docker build --target migrate -t onesync-migrate:ci backend
      - name: Compose smoke
        working-directory: backend
        run: |
          docker compose up -d --build api
          for i in $(seq 1 40); do curl -fsS localhost:8080/health/ready && ok=1 && break; sleep 3; done
          [ "${ok:-}" = 1 ] || { docker compose logs; exit 1; }
          docker compose down -v
