name: Desktop release

# Builds the OneSyncERP desktop app (desktop-client/, Electron) for Windows, macOS and Linux and publishes the installers on the
# repository's Releases page.
#
#   Publish a release:  push a tag   git tag desktop-v1.0.0 && git push origin desktop-v1.0.0
#                  or:  Actions tab -> "Desktop release" -> Run workflow -> enter the version (for example 1.0.0)
#   A version with a dash (1.0.0-rc.1) is published as a pre-release.
#
# Installers are UNSIGNED unless signing secrets exist (see "Signing" below), so Windows SmartScreen and macOS Gatekeeper will warn:
#   Windows: More info -> Run anyway.   macOS: right-click the app -> Open (or: xattr -dr com.apple.quarantine /Applications/OneSyncERP.app).
#
# Optional repository secrets (the workflow signs only when they are present):
#   Windows:  WIN_CSC_LINK (base64 .pfx or https URL), WIN_CSC_KEY_PASSWORD
#   macOS:    MAC_CSC_LINK (base64 .p12), MAC_CSC_KEY_PASSWORD, and for notarisation APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, for example 1.0.0 (a dash makes it a pre-release: 1.0.0-rc.1)'
        required: true
        type: string

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then raw="$INPUT_VERSION"; else raw="${REF_NAME#desktop-v}"; fi
          raw="${raw#v}"
          if ! echo "$raw" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then echo "Not a version: '$raw' (use 1.2.3 or 1.2.3-rc.1)"; exit 1; fi
          echo "version=$raw" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$raw" >> "$GITHUB_OUTPUT"
          case "$raw" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

  verify:
    # A quick gate so a broken build is never published. The full browser and Electron journeys run in desktop-client.yml.
    runs-on: ubuntu-latest
    needs: plan
    defaults:
      run:
        working-directory: desktop-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  build:
    needs: [plan, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            args: --win nsis --x64
          - os: macos-latest
            label: macos
            args: --mac dmg --x64 --arm64
          - os: ubuntu-latest
            label: linux
            args: --linux AppImage deb --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-client/package-lock.json
      - run: npm ci
      - name: Stamp the version
        shell: bash
        run: npm version "${{ needs.plan.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npx electron-vite build
      - name: Signing (only when the secrets exist)
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signed=false
          if [ "${{ matrix.label }}" = "windows" ] && [ -n "$WIN_CSC_LINK" ]; then
            echo "CSC_LINK=$WIN_CSC_LINK" >> "$GITHUB_ENV"; echo "CSC_KEY_PASSWORD=$WIN_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"; signed=true
          fi
          if [ "${{ matrix.label }}" = "macos" ] && [ -n "$MAC_CSC_LINK" ]; then
            echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"; echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"; signed=true
            if [ -n "$APPLE_ID" ]; then echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"; echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"; echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"; fi
          fi
          if [ "$signed" = "false" ]; then echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"; echo "::notice::No signing secrets for ${{ matrix.label }}: building an unsigned installer"; fi
      - name: Build the installer
        shell: bash
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: List what was built
        shell: bash
        run: ls -la release | grep -E '\.(exe|dmg|AppImage|deb)$'
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.label }}
          path: |
            desktop-client/release/*.exe
            desktop-client/release/*.dmg
            desktop-client/release/*.AppImage
            desktop-client/release/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          SHA: ${{ github.sha }}
        run: |
          cat > notes.md <<EOF
          ## OneSyncERP desktop $VERSION

          | System | File |
          |---|---|
          | Windows 10/11 (64-bit) | \`OneSyncERP-$VERSION-win-x64.exe\` |
          | macOS, Apple Silicon (M1 and later) | \`OneSyncERP-$VERSION-mac-arm64.dmg\` |
          | macOS, Intel | \`OneSyncERP-$VERSION-mac-x64.dmg\` |
          | Linux, any distribution | \`OneSyncERP-$VERSION-linux-x86_64.AppImage\` (make it executable, then run) |
          | Linux, Debian/Ubuntu | \`OneSyncERP-$VERSION-linux-amd64.deb\` |

          The app needs a running OneSyncERP server: enter its address on first start.

          **Unsigned builds.** Until signing certificates are added these installers are not signed, so the system warns on first run.
          Windows: *More info* then *Run anyway*. macOS: right-click the app, *Open*; or run \`xattr -dr com.apple.quarantine /Applications/OneSyncERP.app\`.
          Check the download against \`SHA256SUMS.txt\`.
          EOF
          sed -i 's/^          //' notes.md
          flags=""; [ "$PRERELEASE" = "true" ] && flags="--prerelease"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber *.exe *.dmg *.AppImage *.deb SHA256SUMS.txt
          else
            gh release create "$TAG" *.exe *.dmg *.AppImage *.deb SHA256SUMS.txt --target "$SHA" --title "OneSyncERP desktop $VERSION" --notes-file notes.md $flags
          fi
