name: gateway
on:
  push:
    paths: ['gateway/**', 'agent/src/tunnel.ts', 'control-plane/src/**', '.github/workflows/gateway.yml']
  pull_request:
    paths: ['gateway/**', 'agent/src/tunnel.ts', 'control-plane/src/**', '.github/workflows/gateway.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    env:
      TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5434/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: control-plane
      - run: npm ci
        working-directory: agent
      - run: npm ci
        working-directory: gateway
      - run: npm run typecheck && npm run lint && npm test
        working-directory: gateway
