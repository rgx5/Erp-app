# Local development stack. Passwords below are throwaway dev values; never reuse them.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: erp
      MIGRATOR_PASSWORD: erp_migrator_dev_password
      APP_PASSWORD: erp_app_dev_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./db/bootstrap:/bootstrap:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp"]
      interval: 3s
      retries: 20
  migrate:
    build: { context: ., target: migrate }
    environment:
      MIGRATOR_DATABASE_URL: postgresql://erp_migrator:erp_migrator_dev_password@postgres:5432/erp
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build: { context: ., target: runtime }
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://erp_app:erp_app_dev_password@postgres:5432/erp
      PLATFORM_ADMIN_TOKEN: dev-platform-admin-token-change-me-0123456789
    ports: ["8080:8080"]
    depends_on: { migrate: { condition: service_completed_successfully } }
volumes:
  pgdata:
