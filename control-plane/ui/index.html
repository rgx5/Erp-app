<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OneSyncERP Control Plane</title>
<style>
:root{--ink:#0e1220;--muted:#5b6377;--line:#e9e6de;--bg:#f4f3ef;--brand:#2b59ff;--hero:#0c1747;--good:#0a8a5e;--bad:#d6343b;--warn:#b86e00}
*{box-sizing:border-box}body{margin:0;font:13px/1.45 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--hero);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px}header b{font-size:15px}header span{flex:1}
main{padding:20px;max-width:1300px;margin:0 auto}h1{font-size:20px;margin:0 0 12px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
input,select,button{font:inherit;padding:6px 10px;border:1px solid #d5d1c5;border-radius:6px;background:#fff}button{cursor:pointer}button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}tr.row{cursor:pointer}tr.row:hover td{background:#f6f8ff}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:600}.healthy{background:#e1f5ec;color:var(--good)}.degraded{background:#fff2d6;color:var(--warn)}.silent{background:#fce8e9;color:var(--bad)}.never{background:#eee;color:var(--muted)}
.tiles{display:flex;gap:10px;margin-bottom:14px}.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:120px;cursor:pointer}.tile b{display:block;font-size:22px}
.muted{color:var(--muted)}.err{color:var(--bad);margin:8px 0}pre{background:#f4f3ef;padding:8px;border-radius:6px;overflow:auto}
</style></head><body>
<header><b>OneSyncERP Control Plane</b><span></span><div id="who"></div><button id="out" hidden>Sign out</button></header>
<main id="app"></main>
<script>
const $=(s)=>document.querySelector(s);let token=sessionStorage.getItem('cp');let state={filter:'',detail:null};
const api=async(p,o={})=>{const r=await fetch(p,{...o,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{}),...o.headers},body:o.body?JSON.stringify(o.body):undefined});const j=r.status===204?{}:await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.message||r.statusText),{status:r.status});return j};
const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function login(msg){$('#app').innerHTML=`<div class="card" style="max-width:360px;margin:60px auto"><h1>Staff sign in</h1><p><input id="e" placeholder="Email" style="width:100%"></p><p><input id="p" type="password" placeholder="Password" style="width:100%"></p><p><input id="c" placeholder="Authenticator code (if on)" style="width:100%" autocomplete="one-time-code"></p><p class="err">${esc(msg||'')}</p><button class="primary" id="go">Sign in</button></div>`;$('#go').onclick=async()=>{try{const r=await api('/auth/login',{method:'POST',body:{email:$('#e').value,password:$('#p').value,...($('#c').value?{code:$('#c').value}:{})}});token=r.token;sessionStorage.setItem('cp',token);$('#who').textContent=r.staff.displayName+' ('+r.staff.role+')';$('#out').hidden=false;fleet()}catch(e){login(e.message)}}}
$('#out').onclick=async()=>{try{await api('/auth/logout',{method:'POST'})}catch{}sessionStorage.removeItem('cp');token=null;$('#out').hidden=true;$('#who').textContent='';login()};
async function fleet(){try{const r=await api('/fleet'+(state.filter?'?state='+state.filter:''));const t=(k,l)=>`<div class="tile" data-f="${k}"><b>${r.summary[k]}</b><span class="pill ${k}">${l}</span></div>`;
$('#app').innerHTML=`<h1>Fleet</h1><div class="tiles">${t('healthy','Healthy')}${t('degraded','Degraded')}${t('silent','Silent')}${t('never','Never seen')}<div class="tile" data-f=""><b>${Object.values(r.summary).reduce((a,b)=>a+b,0)}</b><span class="muted">All</span></div></div>
<div class="card"><table><thead><tr><th>Site</th><th>Client</th><th>Tier</th><th>State</th><th>Version</th><th>Last seen</th><th>Licence</th></tr></thead><tbody>${r.items.map(s=>`<tr class="row" data-id="${s.id}"><td><b>${esc(s.code)}</b><br><span class="muted">${esc(s.name)}</span></td><td>${esc(s.client.name)}</td><td>${esc(s.client.tier)}</td><td><span class="pill ${s.health.state}">${s.health.state}</span><br><span class="muted">${esc(s.health.reasons.join('; '))}</span></td><td>${esc(s.version||'')}</td><td>${s.lastSeenAt?new Date(s.lastSeenAt).toLocaleString():''}</td><td>${s.licence?esc(s.licence.plan)+'<br><span class="muted">'+esc(s.licence.modules.join(', '))+'</span>':'<span class="muted">none</span>'}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">No sites.</td></tr>'}</tbody></table></div>`;
document.querySelectorAll('.tile').forEach(e=>e.onclick=()=>{state.filter=e.dataset.f;fleet()});document.querySelectorAll('tr.row').forEach(e=>e.onclick=()=>detail(e.dataset.id))}catch(e){if(e.status===401){sessionStorage.removeItem('cp');token=null;login('Please sign in')}else $('#app').innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
async function detail(id){const s=await api('/sites/'+id);$('#app').innerHTML=`<p><button id="back">Back to the fleet</button></p><h1>${esc(s.code)} · ${esc(s.name)}</h1><div class="card"><span class="pill ${s.health.state}">${s.health.state}</span> ${esc(s.health.reasons.join('; '))}<p class="muted">${esc(s.client.name)} · ${esc(s.client.tier)} · ring ${s.ring}${s.updatesPaused?' · updates paused':''} · tenant ${esc(s.tenantId||'not set')}</p></div><div class="card"><b>Recent heartbeats</b><pre>${esc(JSON.stringify(s.recentHeartbeats.slice(0,3),null,2))}</pre></div>`;$('#back').onclick=fleet}
if(token){$('#out').hidden=false;api('/me').then(m=>{$('#who').textContent=m.displayName+' ('+m.role+')';fleet()}).catch(()=>login())}else login();
</script></body></html>
