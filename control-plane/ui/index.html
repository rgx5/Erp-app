<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OneSyncERP Super Admin</title>
<style>
:root{--ink:#0e1220;--muted:#5b6377;--line:#e9e6de;--bg:#f4f3ef;--brand:#2b59ff;--hero:#0c1747;--good:#0a8a5e;--bad:#d6343b;--warn:#b86e00;--goodbg:#e1f5ec;--badbg:#fce8e9;--warnbg:#fff2d6}
*{box-sizing:border-box}body{margin:0;font:13px/1.45 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.shell{display:grid;grid-template-columns:210px 1fr;min-height:100vh}aside{background:var(--hero);color:#cfd6f5;padding:16px 10px;position:sticky;top:0;height:100vh}
aside h1{font-size:15px;color:#fff;margin:0 8px 16px;letter-spacing:-.01em}aside small{display:block;color:#8f9bd4;font-weight:400;font-size:11px}
aside a{display:block;color:#cfd6f5;text-decoration:none;padding:8px 10px;border-radius:8px;margin-bottom:2px}aside a:hover{background:#1a2766}aside a.on{background:#fff;color:var(--hero);font-weight:600}
aside .who{position:absolute;bottom:14px;left:10px;right:10px;font-size:12px;color:#8f9bd4}aside .who button{margin-top:6px;width:100%}
main{padding:22px 26px;max-width:1400px;width:100%}h2{font-size:20px;margin:0 0 14px;letter-spacing:-.01em}h3{font-size:14px;margin:0 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}.kpi b{display:block;font-size:26px;letter-spacing:-.02em}.kpi span{color:var(--muted)}
input,select,button,textarea{font:inherit;padding:7px 10px;border:1px solid #d5d1c5;border-radius:8px;background:#fff}button{cursor:pointer}button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}button.danger{background:#fff;color:var(--bad);border-color:#e7b4b7}button:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}tr.row{cursor:pointer}tr.row:hover td{background:#f6f8ff}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:11.5px;font-weight:600}.healthy,.pass,.done,.active{background:var(--goodbg);color:var(--good)}.attention,.warn,.degraded,.pending,.running{background:var(--warnbg);color:var(--warn)}.critical,.fail,.silent,.failed,.suspended{background:var(--badbg);color:var(--bad)}.never,.muted{background:#eee;color:var(--muted)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#eee}.bar i{display:block}
.row2{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.row2 label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:3px}
.alert{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}.alert:last-child{border:0}.dot{width:8px;height:8px;border-radius:5px;margin-top:6px;flex:none}.dot.critical{background:var(--bad)}.dot.attention{background:var(--warn)}
.err{color:var(--bad);margin:6px 0}.ok{color:var(--good);margin:6px 0}.muted-t{color:var(--muted)}code,pre{background:#f4f3ef;border-radius:6px;padding:2px 5px}pre{padding:8px;overflow:auto}
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mods label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink)}
.login{max-width:360px;margin:80px auto}.login input{width:100%;margin-bottom:10px}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside{position:static;height:auto}.g4,.g3,.g2,.mods{grid-template-columns:1fr 1fr}}
</style></head><body><div id="root"></div>
<script>
const MODULES=['sales','purchasing','inventory','pos','accounting','gst','banking','approvals','manufacturing','payroll','extras'];
const DEPENDS={pos:['sales','inventory'],gst:['sales','accounting'],banking:['accounting'],manufacturing:['inventory'],payroll:['accounting']};
const LIMITS=['users','companies','locations','terminals','sites'];
let token=sessionStorage.getItem('cp'),me=null,mfaNeeded=false;
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when=s=>s?new Date(s).toLocaleString():'';const ago=s=>{if(!s)return'never';const m=Math.round((Date.now()-new Date(s))/60000);return m<2?'just now':m<120?m+' min ago':m<2880?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
const pill=(c,t)=>`<span class="pill ${esc(c)}">${esc(t??c)}</span>`;
const can=r=>({viewer:1,support:2,admin:3}[me?.role]||0)>=({viewer:1,support:2,admin:3}[r]);
async function api(path,o={}){const r=await fetch(path,{...o,headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{}),...o.headers},body:o.body?JSON.stringify(o.body):undefined});const j=r.status===204?{}:await r.json().catch(()=>({}));if(!r.ok){const e=new Error((j.issues?.length?j.issues.map(i=>(i.path?i.path+': ':'')+i.message).join('; '):j.message)||r.statusText);e.status=r.status;e.code=j.code;throw e}return j}
function toast(msg,bad){const d=document.createElement('div');d.className=bad?'err':'ok';d.textContent=msg;d.style.cssText='position:fixed;right:20px;bottom:20px;background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:9';document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}
// ---------- sign in ----------
function login(msg,needCode){$('#root').innerHTML=`<div class="card login"><h2>Super admin sign in</h2><input id="e" placeholder="Email" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password">${needCode?'<input id="c" placeholder="Authenticator or recovery code" autocomplete="one-time-code" autofocus>':''}<p class="err">${esc(msg||'')}</p><button class="primary" id="go" style="width:100%">Sign in</button></div>`;
 const go=async()=>{try{const r=await api('/auth/login',{method:'POST',body:{email:$('#e').value,password:$('#p').value,...($('#c')&&$('#c').value?{code:$('#c').value}:{})}});token=r.token;sessionStorage.setItem('cp',token);me=r.staff;mfaNeeded=r.mfaSetupRequired;start()}catch(e){login(e.message,e.code==='mfa_required'||e.code==='invalid_code'||needCode)}};$('#go').onclick=go;$('#root').onkeydown=e=>{if(e.key==='Enter')go()}}
async function mfaSetup(){const s=await api('/auth/mfa/enrol',{method:'POST'});$('#root').innerHTML=`<div class="card login"><h2>Set up two-step sign-in</h2><p>Add this secret to an authenticator app, then enter the 6-digit code.</p><pre>${esc(s.secret)}</pre><input id="c" placeholder="6-digit code"><p class="err" id="m"></p><button class="primary" id="go" style="width:100%">Turn on</button></div>`;
 $('#go').onclick=async()=>{try{const r=await api('/auth/mfa/activate',{method:'POST',body:{code:$('#c').value}});$('#root').innerHTML=`<div class="card login"><h2>Recovery codes</h2><p>Keep these safe. Each works once if you lose your phone.</p><pre>${esc(r.recoveryCodes.join('\n'))}</pre><button class="primary" id="ok" style="width:100%">I have saved them</button></div>`;$('#ok').onclick=()=>{mfaNeeded=false;start()}}catch(e){$('#m').textContent=e.message}}}
// ---------- shell ----------
const NAV=[['overview','Overview'],['tenants','Tenants'],['cells','Cells'],['remote','Remote access'],['releases','Releases'],['audit','Audit log']];
function shell(page){return `<div class="shell"><aside><h1>OneSyncERP<small>Super admin</small></h1>${NAV.filter(n=>n[0]!=='audit'||can('admin')).map(n=>`<a href="#/${n[0]}" class="${page===n[0]?'on':''}">${n[1]}</a>`).join('')}<div class="who">${esc(me?.displayName)} · ${esc(me?.role)}<button id="out">Sign out</button></div></aside><main id="main"></main></div>`}
async function start(){if(!me){try{me=await api('/me')}catch(e){return login()}}if(mfaNeeded)return mfaSetup();route()}
async function route(){const h=location.hash.replace(/^#\/?/,'').split('?')[0]||'overview';const [page,arg]=h.split('/');$('#root').innerHTML=shell(page);$('#out').onclick=async()=>{try{await api('/auth/logout',{method:'POST'})}catch{}sessionStorage.removeItem('cp');token=null;me=null;login()};
 const m=$('#main');m.innerHTML='<p class="muted-t">Loading…</p>';try{({overview,tenants:tenantsPage,cells,remote:remoteAll,releases,audit}[page]||overview)(m,arg)}catch(e){fail(m,e)}}
function fail(m,e){if(e.status===401){sessionStorage.removeItem('cp');token=null;me=null;return login('Please sign in again')}m.innerHTML=`<p class="err">${esc(e.message)}</p>`}
window.addEventListener('hashchange',()=>token&&route());
const wrap=fn=>async(m,a)=>{try{await fn(m,a)}catch(e){fail(m,e)}};
const barOf=(counts,colors)=>{const t=Object.values(counts).reduce((a,b)=>a+b,0)||1;return `<div class="bar">${Object.entries(counts).map(([k,v])=>`<i style="width:${v/t*100}%;background:${colors[k]||'#9aa3c7'}" title="${esc(k)}: ${v}"></i>`).join('')}</div>`};
const HC={healthy:'#0a8a5e',attention:'#e0a100',critical:'#d6343b',degraded:'#e0a100',silent:'#d6343b',never:'#aaa',active:'#0a8a5e',suspended:'#d6343b'};
// ---------- overview ----------
const overview=wrap(async m=>{const [o,a]=await Promise.all([api('/overview'),null]);const k=(n,l,c)=>`<div class="kpi"><b ${c?`style="color:${c}"`:''}>${n}</b><span>${l}</span></div>`;
 m.innerHTML=`<h2>Overview</h2><div class="grid g4" style="margin-bottom:14px">${k(o.cells.total,'cells (sites and pooled)')}${k(o.tenants.total,'tenants')}${k(o.alerts.critical,'critical alerts',o.alerts.critical?'var(--bad)':'')}${k(o.alerts.attention,'need attention',o.alerts.attention?'var(--warn)':'')}</div>
 <div class="grid g2"><div class="card"><h3>Cell health</h3>${barOf(o.cells.byState,HC)}<p class="muted-t">${Object.entries(o.cells.byState).map(([k,v])=>pill(k,`${k} ${v}`)).join(' ')}</p><h3 style="margin-top:14px">Tenant health</h3>${barOf(o.tenants.byHealth,HC)}<p class="muted-t">${Object.entries(o.tenants.byHealth).map(([k,v])=>pill(k,`${k} ${v}`)).join(' ')}</p></div>
 <div class="card"><h3>Licences</h3><p>${o.tenants.licencesExpiringSoon} expiring within 30 days · ${o.tenants.unlicensed} unrestricted (no licence) · ${o.tenants.byStatus.suspended||0} suspended</p><p class="muted-t">${Object.entries(o.tenants.byPlan).map(([k,v])=>`${esc(k)}: ${v}`).join(' · ')||'no plans yet'}</p><h3 style="margin-top:14px">Use, last 30 days</h3><p>${o.usage.users} active users · ${o.usage.documents30d} documents</p><h3 style="margin-top:14px">Versions in the field</h3><p class="muted-t">${Object.entries(o.versions).map(([k,v])=>`${esc(k)}: ${v}`).join(' · ')||'none yet'}</p></div></div>
 <div class="card"><h3>Needs attention</h3>${o.alerts.top.length?o.alerts.top.map(x=>`<div class="alert"><span class="dot ${x.level}"></span><div><b>${esc(x.subject)}</b> <span class="muted-t">${esc(x.kind)}</span><br>${esc(x.text)}</div></div>`).join(''):'<p class="muted-t">Everything looks fine.</p>'}${o.alerts.critical+o.alerts.attention>o.alerts.top.length?`<p><a href="#/tenants?health=critical">See all tenants needing attention</a></p>`:''}</div>`});
// ---------- tenants ----------
const tenantsPage=wrap(async(m,arg)=>{if(arg&&!arg.startsWith('?'))return tenantDetail(m,arg);const qs=new URLSearchParams(location.hash.split('?')[1]||'');
 const draw=async()=>{const r=await api('/tenants?'+qs.toString());$('#list').innerHTML=`<table><thead><tr><th>Tenant</th><th>Client / cell</th><th>Health</th><th>Licence</th><th>Users</th><th>Docs 30d</th><th>Last activity</th></tr></thead><tbody>${r.items.map(t=>`<tr class="row" data-id="${t.tenantId}"><td><b>${esc(t.name)}</b><br><span class="muted-t">${esc(t.slug)}</span> ${t.status==='suspended'?pill('suspended'):''}</td><td>${esc(t.client.name)}<br><span class="muted-t">${esc(t.cell.code)} · ${esc(t.cell.kind)} · ${esc(t.client.tier)}</span></td><td>${pill(t.health)}<br><span class="muted-t">${esc(t.reasons[0]?.text||'')}</span></td><td>${t.licence.restricted?esc(t.licence.plan||'custom')+'<br><span class="muted-t">'+(t.licence.expiresAt?'ends '+new Date(t.licence.expiresAt).toLocaleDateString():'no expiry')+(t.licence.readOnly?' · read-only':'')+'</span>':'<span class="muted-t">none (unrestricted)</span>'}</td><td>${t.usage.users??''}${t.licence.limits?.users?' / '+t.licence.limits.users:''}</td><td>${t.usage.documents30d??''}</td><td>${ago(t.usage.lastActivityAt)}</td></tr>`).join('')||'<tr><td colspan="7" class="muted-t">No tenants match.</td></tr>'}</tbody></table><p class="muted-t">${r.total} tenant(s)</p>`;$$('tr.row',$('#list')).forEach(x=>x.onclick=()=>{location.hash='#/tenants/'+x.dataset.id})};
 m.innerHTML=`<h2>Tenants</h2><div class="card"><div class="row2"><label>Search<input id="q" placeholder="name, code, client, cell" value="${esc(qs.get('q')||'')}"></label><label>Status<select id="st"><option value="">any</option><option>active</option><option>suspended</option></select></label><label>Health<select id="hl"><option value="">any</option><option>healthy</option><option>attention</option><option>critical</option></select></label><label>Licence<select id="lc"><option value="">any</option><option value="none">none</option><option value="expiring">expiring in 30 days</option><option value="expired">expired</option><option value="readonly">read-only</option></select></label></div><div id="list"></div></div>`;
 $('#st').value=qs.get('status')||'';$('#hl').value=qs.get('health')||'';$('#lc').value=qs.get('licence')||'';
 const apply=()=>{for(const [k,id] of [['q','q'],['status','st'],['health','hl'],['licence','lc']]){const v=$('#'+id).value;v?qs.set(k,v):qs.delete(k)}draw()};let t;$('#q').oninput=()=>{clearTimeout(t);t=setTimeout(apply,250)};['st','hl','lc'].forEach(id=>$('#'+id).onchange=apply);await draw()});
async function tenantDetail(m,id){const t=await api('/tenants/'+id);const L=t.licence||{};const mods=new Set(L.modules||[]);
 const checks=(t.validations?.checks||[]).map(c=>`<tr><td>${pill(c.status)}</td><td>${esc(c.label)}</td><td class="muted-t">${esc(c.detail)}</td></tr>`).join('');
 m.innerHTML=`<p><a href="#/tenants">← All tenants</a></p><h2>${esc(t.name)} ${pill(t.health)} ${t.status==='suspended'?pill('suspended'):''}</h2><p class="muted-t">${esc(t.slug)} · ${esc(t.client.name)} (${esc(t.client.tier)}) · cell <a href="#/cells/${t.cell.id}">${esc(t.cell.code)}</a> · reported ${ago(t.reportedAt)}</p>
 ${t.reasons.length?`<div class="card"><h3>Why it needs attention</h3>${t.reasons.map(r=>`<div class="alert"><span class="dot ${r.level}"></span><div>${esc(r.text)}</div></div>`).join('')}</div>`:''}
 <div class="grid g4" style="margin-bottom:14px">${[['users','users'],['companies','companies'],['documents30d','documents (30 d)'],['events30d','events (30 d)']].map(([k,l])=>`<div class="kpi"><b>${t.usage[k]??'–'}</b><span>${l}${t.licence.limits?.[k]?` · limit ${t.licence.limits[k]}`:''}</span></div>`).join('')}</div>
 <div class="grid g2"><div class="card"><h3>Validations ${t.validations?pill(t.validations.ok?'pass':'fail',t.validations.ok?'all pass':'problems'):''}</h3><p class="muted-t">${t.validatedAt?'Last run '+ago(t.validatedAt):'Not run yet'}</p>${checks?`<table><tbody>${checks}</tbody></table>`:''}${can('support')?'<p><button id="val">Run checks now</button></p>':''}</div>
 <div class="card"><h3>Tenant status</h3><p>${t.status==='active'?'Active: people can sign in.':'Suspended: nobody can sign in.'}</p>${can('admin')?`<div class="row2"><label>Reason<input id="reason" placeholder="why"></label><button id="stat" class="${t.status==='active'?'danger':'primary'}">${t.status==='active'?'Suspend tenant':'Reactivate tenant'}</button></div>`:'<p class="muted-t">Only an admin can change this.</p>'}<p class="muted-t">The change is carried out by the cell within seconds.</p></div></div>
 <div class="card"><h3>Licence ${L.restricted?'':'<span class="muted-t">(none: unrestricted)</span>'}</h3>${can('admin')?`<div class="row2"><label>Plan<input id="plan" value="${esc(L.plan||'')}" placeholder="Hybrid"></label><label>Expires<input id="exp" type="date" value="${L.expiresAt?L.expiresAt.slice(0,10):''}"></label><label>Grace days<input id="grace" type="number" min="0" max="365" value="14" style="width:80px"></label><label style="flex-direction:row;align-items:center;gap:6px;color:var(--ink)"><input id="ro" type="checkbox" ${L.readOnly?'checked':''}> read-only (suspended)</label></div>
 <div class="mods">${MODULES.map(x=>`<label><input type="checkbox" class="mod" value="${x}" ${mods.has(x)?'checked':''}> ${x}</label>`).join('')}</div><p class="muted-t" id="depnote"></p>
 <div class="row2" style="margin-top:8px">${LIMITS.map(k=>`<label>${k} limit<input class="lim" data-k="${k}" type="number" min="0" style="width:90px" value="${L.limits?.[k]??''}"></label>`).join('')}</div><button class="primary" id="issue">Sign and issue licence</button> <span class="muted-t">Reaches the cell on its next visit.</span>`:`<p>${esc(L.plan||'')} ${(L.modules||[]).join(', ')}</p>`}
 <h3 style="margin-top:14px">History</h3><table><tbody>${(t.licences||[]).map(l=>`<tr><td>${esc(l.licence_id)}</td><td>${esc(l.licence.plan)}</td><td class="muted-t">${esc((l.licence.modules||[]).join(', '))}</td><td>${when(l.issued_at)}</td><td>${l.revoked_at?pill('failed','revoked'):''}</td></tr>`).join('')||'<tr><td class="muted-t">None</td></tr>'}</tbody></table></div>
 <div class="card"><h3>Requests to the cell</h3><table><tbody>${(t.commands||[]).map(c=>`<tr><td>${esc(c.type)}</td><td>${pill(c.status)}</td><td class="muted-t">${esc(c.result?.message||c.payload?.reason||'')}</td><td>${when(c.created_at)} · ${esc(c.requested_by)}</td></tr>`).join('')||'<tr><td class="muted-t">None</td></tr>'}</tbody></table></div>`;
 const send=async(body,msg)=>{try{await api(`/tenants/${id}/commands`,{method:'POST',body});toast(msg)}catch(e){toast(e.message,true)}};
 if($('#val'))$('#val').onclick=()=>send({type:'validate'},'Check requested: refresh in a few seconds');
 if($('#stat'))$('#stat').onclick=()=>send({type:t.status==='active'?'suspend':'reactivate',reason:$('#reason').value},t.status==='active'?'Suspension requested':'Reactivation requested');
 const sync=e=>{const on=new Set($$('.mod').filter(x=>x.checked).map(x=>x.value));let added=[];for(let ch=true;ch;){ch=false;for(const x of [...on])for(const d of DEPENDS[x]||[])if(!on.has(d)){on.add(d);added.push(d);ch=true}}$$('.mod').forEach(x=>x.checked=on.has(x.value));$('#depnote').textContent=added.length?'Also added: '+added.join(', ')+' (needed by the others)':''};$$('.mod').forEach(x=>x.onchange=sync);
 if($('#issue'))$('#issue').onclick=async()=>{const limits={};$$('.lim').forEach(x=>{if(x.value!=='')limits[x.dataset.k]=Number(x.value)});try{const r=await api(`/tenants/${id}/licences`,{method:'POST',body:{plan:$('#plan').value||'Custom',modules:$$('.mod').filter(x=>x.checked).map(x=>x.value),limits,readOnly:$('#ro').checked,expiresAt:$('#exp').value?new Date($('#exp').value+'T23:59:59Z').toISOString():null,graceDays:Number($('#grace').value||14)}});toast('Issued '+r.licence.licenceId);tenantDetail(m,id)}catch(e){toast(e.message,true)}}}
// ---------- cells ----------
const cells=wrap(async(m,arg)=>{if(arg)return cellDetail(m,arg);const r=await api('/fleet');
 m.innerHTML=`<h2>Cells</h2><div class="grid g4" style="margin-bottom:14px">${Object.entries(r.summary).map(([k,v])=>`<div class="kpi"><b>${v}</b>${pill(k)}</div>`).join('')}</div><div class="card"><table><thead><tr><th>Cell</th><th>Client</th><th>Kind / tier</th><th>Health</th><th>Version</th><th>Last seen</th><th>Ring</th></tr></thead><tbody>${r.items.map(s=>`<tr class="row" data-id="${s.id}"><td><b>${esc(s.code)}</b><br><span class="muted-t">${esc(s.name)}</span></td><td>${esc(s.client.name)}</td><td>${esc(s.kind)} · ${esc(s.client.tier)}</td><td>${pill(s.health.state)}<br><span class="muted-t">${esc(s.health.reasons.join('; '))}</span></td><td>${esc(s.version||'')}</td><td>${ago(s.lastSeenAt)}</td><td>${s.ring}${s.updatesPaused?' · paused':''}</td></tr>`).join('')||'<tr><td colspan="7" class="muted-t">No cells.</td></tr>'}</tbody></table></div>`;$$('tr.row').forEach(x=>x.onclick=()=>{location.hash='#/cells/'+x.dataset.id})});

const DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function remoteForm(s){const r=s.remote.rules,h=r.hours,dis=can('admin')?'':'disabled';
 return `<div class="row2"><label style="flex-direction:row;align-items:center;gap:6px;color:var(--ink)"><input id="rae" type="checkbox" ${s.remote.enabled?'checked':''} ${dis}> remote access switched on</label><label>Address<input id="rah" value="${esc(s.remote.hostname||'')}" placeholder="pune.remote.example.in" style="width:260px" ${dis}></label><label>What remote users may do<select id="rm" ${dis}><option value="full" ${r.mode==='full'?'selected':''}>Everything the product allows</option><option value="readonly" ${r.mode==='readonly'?'selected':''}>View only (no changes)</option><option value="owner_only" ${r.mode==='owner_only'?'selected':''}>Owner dashboard only</option></select></label><label>Max requests per second<input id="rr" type="number" min="1" max="200" value="${r.requestsPerSecond||''}" placeholder="default" style="width:100px" ${dis}></label></div>
 <div class="row2"><label>Only from these networks (one per line, empty = anywhere)<textarea id="rn" rows="3" style="width:300px" placeholder="203.0.113.0/24" ${dis}>${esc((r.allowedNetworks||[]).join('\n'))}</textarea></label>
 <div><label style="flex-direction:row;align-items:center;gap:6px;color:var(--ink)"><input id="rhe" type="checkbox" ${h?'checked':''} ${dis}> only at these times</label><div class="row2" style="margin:6px 0">${DAYN.map((d,i)=>`<label style="flex-direction:row;gap:3px;align-items:center;color:var(--ink)"><input type="checkbox" class="rd" value="${i}" ${(h?h.days:[1,2,3,4,5,6]).includes(i)?'checked':''} ${dis}>${d}</label>`).join('')}</div><div class="row2"><label>From<input id="rf" type="time" value="${h?.from||'08:00'}" ${dis}></label><label>To<input id="rt" type="time" value="${h?.to||'21:00'}" ${dis}></label><label>Time zone<input id="rz" value="${esc(h?.timezone||'Asia/Kolkata')}" style="width:150px" ${dis}></label></div></div></div>
 ${can('admin')?'<button class="primary" id="rsave">Save remote access rules</button> <span class="muted-t">Applies within a minute; people already connected are limited on their next request.</span>':'<p class="muted-t">Only an admin can change these.</p>'}`}
async function cellDetail(m,id){const [s,tn,sup]=await Promise.all([api('/sites/'+id),api('/tenants?cell='+id),api(`/sites/${id}/support-sessions`)]);const hb=s.recentHeartbeats?.[0]?.payload||{};
 m.innerHTML=`<p><a href="#/cells">← All cells</a></p><h2>${esc(s.code)} ${pill(s.health.state)}</h2><p class="muted-t">${esc(s.name)} · ${esc(s.client.name)} (${esc(s.client.tier)}) · ring ${s.ring}${s.updatesPaused?' · updates paused':''} · last seen ${ago(s.lastSeenAt)}</p>${s.health.reasons.length?`<div class="card">${s.health.reasons.map(r=>`<div class="alert"><span class="dot attention"></span><div>${esc(r)}</div></div>`).join('')}</div>`:''}
 <div class="grid g4" style="margin-bottom:14px">${[['version',s.version||'–'],['disk free',hb.disk?.freePercent!=null?hb.disk.freePercent+'%':'–'],['last base backup',ago(hb.backup?.lastBaseBackupAt)],['last log shipped',ago(hb.backup?.lastWalShippedAt)]].map(([l,v])=>`<div class="kpi"><b style="font-size:20px">${esc(v)}</b><span>${l}</span></div>`).join('')}</div>
 <div class="card"><h3>Tenants on this cell (${tn.total})</h3><table><tbody>${tn.items.map(t=>`<tr class="row" data-t="${t.tenantId}"><td><b>${esc(t.name)}</b></td><td>${pill(t.health)}</td><td>${esc(t.licence.plan||'no licence')}</td><td>${t.usage.users??''} users</td></tr>`).join('')||'<tr><td class="muted-t">None reported yet.</td></tr>'}</tbody></table></div>

 <div class="card"><h3>Remote access ${s.remote.enabled&&s.remote.hostname?pill('healthy','on'):pill('never','off')}</h3><p class="muted-t">${s.remote.hostname?esc(s.remote.hostname):'No remote address set for this cell.'}${!['hybrid','hybrid_plus'].includes(s.client.tier)?' · this client\'s plan does not include remote access':''}</p>${remoteForm(s)}</div>
 <div class="card"><h3>Remote support</h3>${can('support')?`<div class="row2"><label>Reason<input id="sr" placeholder="what you need to look at" style="width:260px"></label><label>Minutes<input id="sm" type="number" value="30" min="5" max="120" style="width:80px"></label><label>Your SSH public key<input id="sk" placeholder="ssh-ed25519 AAAA…" style="width:300px"></label><button id="sreq">Request session</button></div>`:''}<table><tbody>${sup.items.map(x=>`<tr><td>${pill(x.status)}</td><td>${esc(x.reason)}</td><td class="muted-t">${esc(x.requested_by)} · ${when(x.created_at)}</td><td>${x.status==='awaiting_code'&&can('support')?`<input class="code" data-s="${x.id}" placeholder="code from customer" style="width:130px"> <button class="sendcode" data-s="${x.id}">Send</button>`:''}${['requested','awaiting_code','open'].includes(x.status)&&can('support')?` <button class="danger endsup" data-s="${x.id}">End</button>`:''}</td></tr>`).join('')||'<tr><td class="muted-t">No sessions.</td></tr>'}</tbody></table><p class="muted-t">Access opens only when the customer reads out the code shown on their server.</p></div>`;

 if($('#rsave'))$('#rsave').onclick=async()=>{const nets=$('#rn').value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);const rules={mode:$('#rm').value,allowedNetworks:nets,hours:$('#rhe').checked?{days:$$('.rd').filter(x=>x.checked).map(x=>Number(x.value)),from:$('#rf').value,to:$('#rt').value,timezone:$('#rz').value.trim()}:null};if($('#rr').value)rules.requestsPerSecond=Number($('#rr').value);
  try{await api('/sites/'+id,{method:'PATCH',body:{remoteAccess:$('#rae').checked,hostname:$('#rah').value.trim()||null,remoteRules:rules}});toast('Saved');cellDetail(m,id)}catch(e){toast(e.message,true)}};
 $$('tr.row[data-t]').forEach(x=>x.onclick=()=>{location.hash='#/tenants/'+x.dataset.t});
 if($('#sreq'))$('#sreq').onclick=async()=>{try{await api(`/sites/${id}/support-sessions`,{method:'POST',body:{reason:$('#sr').value,minutes:Number($('#sm').value),publicKey:$('#sk').value.trim()}});toast('Requested');cellDetail(m,id)}catch(e){toast(e.message,true)}};
 $$('.sendcode').forEach(b=>b.onclick=async()=>{try{await api(`/support-sessions/${b.dataset.s}/code`,{method:'POST',body:{code:$(`.code[data-s="${b.dataset.s}"]`).value}});toast('Code sent to the site');setTimeout(()=>cellDetail(m,id),1500)}catch(e){toast(e.message,true)}});
 $$('.endsup').forEach(b=>b.onclick=async()=>{try{await api(`/support-sessions/${b.dataset.s}/close`,{method:'POST'});cellDetail(m,id)}catch(e){toast(e.message,true)}})}

// ---------- remote access across all cells ----------
const MODEN={full:'Everything',readonly:'View only',owner_only:'Owner dashboard only'};
const remoteAll=wrap(async m=>{const r=await api('/remote-access');const f=new URLSearchParams(location.hash.split('?')[1]||'');
 const sel=new Set();
 m.innerHTML=`<h2>Remote access</h2><p class="muted-t">Every cell runs independently; rules are kept here and enforced by the gateway. ${r.on} of ${r.total} cells have remote access on.</p>
 <div class="card"><div class="row2"><label>Search<input id="q" placeholder="cell, client or address"></label><label>Show<select id="fl"><option value="">all cells</option><option value="on">remote on</option><option value="off">remote off</option><option value="noaddr">no address yet</option><option value="ineligible">plan without remote</option></select></label></div><div id="tb"></div></div>
 ${can('admin')?`<div class="card" id="bulk"><h3>Apply to the <span id="cnt">0</span> selected cell(s)</h3><div class="row2"><label>Switch<select id="bs"><option value="">leave as is</option><option value="on">turn remote on</option><option value="off">turn remote off</option></select></label><label>Rules<select id="bm"><option value="">leave as is</option><option value="full">Everything the product allows</option><option value="readonly">View only</option><option value="owner_only">Owner dashboard only</option></select></label><label>Only from networks (one per line)<textarea id="bn" rows="2" style="width:260px" placeholder="leave empty for anywhere"></textarea></label><label style="flex-direction:row;align-items:center;gap:6px;color:var(--ink)"><input id="bh" type="checkbox"> only 08:00 to 21:00, Mon to Sat (India)</label><button class="primary" id="go2" disabled>Apply</button></div><p class="muted-t">When you choose a rule mode, it replaces the cell's whole rule set (networks and hours included). Addresses are set on each cell's page.</p></div>`:''}`;
 const vis=()=>r.items.filter(x=>{const q=$('#q').value.toLowerCase(),fl=$('#fl').value;if(q&&!(x.code+' '+x.name+' '+x.client.name+' '+(x.remote.hostname||'')).toLowerCase().includes(q))return false;const on=x.remote.enabled&&x.remote.hostname&&x.eligible;return !fl||(fl==='on'&&on)||(fl==='off'&&!on)||(fl==='noaddr'&&!x.remote.hostname)||(fl==='ineligible'&&!x.eligible)});
 const draw=()=>{$('#tb').innerHTML=`<table><thead><tr>${can('admin')?'<th><input type="checkbox" id="all"></th>':''}<th>Cell</th><th>Client</th><th>Address</th><th>Remote</th><th>Who / how</th><th>Networks</th><th>Hours</th><th>Tunnel</th></tr></thead><tbody>${vis().map(x=>{const ru=x.remote.rules,on=x.remote.enabled&&x.remote.hostname&&x.eligible;return`<tr>${can('admin')?`<td><input type="checkbox" class="pick" data-id="${x.id}" ${sel.has(x.id)?'checked':''}></td>`:''}<td><a href="#/cells/${x.id}"><b>${esc(x.code)}</b></a><br><span class="muted-t">${esc(x.kind)}</span></td><td>${esc(x.client.name)}<br><span class="muted-t">${esc(x.client.tier)}</span></td><td>${esc(x.remote.hostname||'')||'<span class="muted-t">none</span>'}</td><td>${x.eligible?pill(on?'healthy':'never',on?'on':'off'):pill('never','not in plan')}</td><td>${esc(MODEN[ru.mode])}${ru.requestsPerSecond?`<br><span class="muted-t">${ru.requestsPerSecond}/s max</span>`:''}</td><td>${ru.allowedNetworks.length?`<span title="${esc(ru.allowedNetworks.join(', '))}">${ru.allowedNetworks.length} network(s)</span>`:'<span class="muted-t">anywhere</span>'}</td><td>${ru.hours?esc(ru.hours.from+' to '+ru.hours.to+' · '+ru.hours.days.map(d=>DAYN[d]).join(' ')):'<span class="muted-t">any time</span>'}</td><td>${x.remote.tunnelUp===true?pill('healthy','up'):x.remote.tunnelUp===false?pill('critical','down'):'<span class="muted-t">unknown</span>'}</td></tr>`}).join('')||'<tr><td colspan="9" class="muted-t">No cells match.</td></tr>'}</tbody></table>`;
  $$('.pick').forEach(c=>c.onchange=()=>{c.checked?sel.add(c.dataset.id):sel.delete(c.dataset.id);upd()});if($('#all')){const v=vis();$('#all').checked=v.length>0&&v.every(x=>sel.has(x.id));$('#all').onchange=e=>{vis().forEach(x=>e.target.checked?sel.add(x.id):sel.delete(x.id));draw();upd()}}};
 const upd=()=>{if($('#cnt'))$('#cnt').textContent=sel.size;if($('#go2'))$('#go2').disabled=!sel.size};
 $('#q').oninput=draw;$('#fl').onchange=draw;draw();
 if($('#go2'))$('#go2').onclick=async()=>{const body={siteIds:[...sel]};if($('#bs').value)body.remoteAccess=$('#bs').value==='on';if($('#bm').value)body.remoteRules={mode:$('#bm').value,allowedNetworks:$('#bn').value.split(/\n|,/).map(x=>x.trim()).filter(Boolean),hours:$('#bh').checked?{days:[1,2,3,4,5,6],from:'08:00',to:'21:00',timezone:'Asia/Kolkata'}:null};
  if(body.remoteAccess===undefined&&!body.remoteRules)return toast('Choose a switch or a rule mode',true);if(!confirm('Change remote access for '+sel.size+' cell(s)?'))return;
  try{const x=await api('/remote-access/apply',{method:'POST',body});toast('Updated '+x.updated+' cell(s)');remoteAll(m)}catch(e){toast(e.message,true)}}});
// ---------- releases ----------
const releases=wrap(async m=>{const r=await api('/releases');
 m.innerHTML=`<h2>Releases</h2><div class="card"><table><thead><tr><th>Version</th><th>Status</th><th>Open to</th><th>Notes</th><th></th></tr></thead><tbody>${r.items.map(x=>`<tr><td><b>${esc(x.version)}</b></td><td>${pill(x.status==='rolling'?'attention':x.status==='draft'?'never':'failed',x.status)}</td><td>${x.open_ring==null?'no one yet':['your own site (ring 0)','+ friendly sites (ring 1)','everyone (ring 2)'][x.open_ring]}</td><td class="muted-t">${esc(x.manifest.notes||'')}</td><td>${can('admin')&&x.status!=='withdrawn'?`${x.open_ring!==2?`<button class="promote" data-id="${x.id}">Open to next ring</button> `:''}<button class="danger withdraw" data-id="${x.id}">Withdraw</button>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="muted-t">No releases.</td></tr>'}</tbody></table></div>`;
 $$('.promote').forEach(b=>b.onclick=async()=>{try{await api(`/releases/${b.dataset.id}/promote`,{method:'POST'});toast('Opened');releases(m)}catch(e){toast(e.message,true)}});
 $$('.withdraw').forEach(b=>b.onclick=async()=>{const reason=prompt('Why withdraw this release?');if(!reason)return;try{await api(`/releases/${b.dataset.id}/withdraw`,{method:'POST',body:{reason}});releases(m)}catch(e){toast(e.message,true)}})});
// ---------- audit ----------
const audit=wrap(async m=>{const r=await api('/audit');m.innerHTML=`<h2>Audit log</h2><div class="card"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>On</th><th>Details</th></tr></thead><tbody>${r.items.map(a=>`<tr><td>${when(a.at)}</td><td>${esc(a.staff||'agent / system')}</td><td>${esc(a.action)}</td><td class="muted-t">${esc(a.entity||'')}</td><td class="muted-t">${esc(JSON.stringify(a.details||{}).slice(0,140))}</td></tr>`).join('')}</tbody></table></div>`});
start();
</script></body></html>
