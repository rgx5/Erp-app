# Prometheus alert rules for a OneSyncERP cell. Scrape /metrics (bearer token = PLATFORM_ADMIN_TOKEN) from each cell's api over the private network.
# Thresholds are starting points: tune them after a month of real traffic. Every alert should reach a person who can act on it.
groups:
  - name: onesync-cell
    rules:
      - alert: ApiDown
        expr: up{job="onesync-cell"} == 0
        for: 3m
        labels: { severity: page }
        annotations: { summary: "Cell API is not answering", runbook: "Operations runbook: the API is down" }
      - alert: ServerErrors
        expr: sum(rate(erp_http_requests_total{status="5xx"}[5m])) / sum(rate(erp_http_requests_total[5m])) > 0.02
        for: 10m
        labels: { severity: page }
        annotations: { summary: "More than 2% of requests fail with a server error" }
      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum by (le) (rate(erp_http_request_seconds_bucket[10m]))) > 3
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: "95th percentile request time above 3 seconds" }
      - alert: DatabasePoolExhausted
        expr: erp_db_pool_connections{state="waiting"} > 0
        for: 5m
        labels: { severity: ticket }
        annotations: { summary: "Requests are waiting for a database connection: raise DATABASE_POOL_MAX or find the slow query" }
      - alert: ClientThrottled
        expr: increase(erp_guardrail_rejections_total[15m]) > 20
        for: 0m
        labels: { severity: ticket }
        annotations: { summary: "Clients are being refused for running too much at once: find which client from its usage (GET /v1/platform/tenants/:id/usage) and whether the limit or the client's use is the problem" }
      - alert: OutboxBacklog
        expr: erp_outbox_oldest_pending_seconds > 600
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "Events have waited more than 10 minutes for delivery" }
      - alert: OutboxDeadLetters
        expr: erp_outbox_dead > 0
        for: 30m
        labels: { severity: ticket }
        annotations: { summary: "Events gave up after repeated failures" }
      - alert: BackupsNotReporting
        expr: erp_job_reported{job="backup"} == 0
        for: 2h
        labels: { severity: page }
        annotations: { summary: "Continuous backups are not set up or never ran (BACKUP_S3_* missing?)", runbook: "Operations runbook: backups" }
      - alert: BackupFailed
        expr: erp_job_last_ok{job="backup"} == 0
        for: 1h
        labels: { severity: page }
        annotations: { summary: "The last backup or its verification failed" }
      - alert: BackupTooOld
        expr: erp_backup_base_age_seconds > 129600
        for: 0m
        labels: { severity: page }
        annotations: { summary: "The newest base backup is older than 36 hours" }
      - alert: LogShippingLate
        expr: erp_backup_wal_age_seconds > 900
        for: 15m
        labels: { severity: page }
        annotations: { summary: "Write-ahead log has not been shipped for 15 minutes: point-in-time recovery is stale (RPO promise at risk)" }
      - alert: DumpFailed
        expr: erp_job_last_ok{job="dump"} == 0 or erp_job_last_run_age_seconds{job="dump"} > 129600
        for: 0m
        labels: { severity: ticket }
        annotations: { summary: "The daily dump failed or is older than 36 hours" }
      - alert: RestoreDrillFailed
        expr: erp_job_last_ok{job="drill"} == 0 or erp_job_last_run_age_seconds{job="drill"} > 3456000
        for: 0m
        labels: { severity: page }
        annotations: { summary: "The monthly restore drill failed or has not run for 40 days: backups are unproven" }
      - alert: RetentionStopped
        expr: erp_job_last_ok{job="retention"} == 0 or erp_job_last_run_age_seconds{job="retention"} > 259200
        for: 0m
        labels: { severity: ticket }
        annotations: { summary: "Housekeeping failed or has not run for 3 days" }
      - alert: DatabaseGrowth
        expr: predict_linear(erp_database_size_bytes[7d], 30 * 86400) > 0.8 * node_filesystem_size_bytes{mountpoint="/var/lib/docker"}
        for: 6h
        labels: { severity: ticket }
        annotations: { summary: "At the current rate the database will fill 80% of the disk within 30 days (needs node-exporter on the host)" }
